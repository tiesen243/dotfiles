[bar.default]
# ─────────────────────────────────────────────
# Layout
# ─────────────────────────────────────────────
start = ["control-center", "workspaces"]
center = ["clock"]
end = ["tray", "network", "bluetooth", "output_volume", "brightness", "battery"]

thickness = 24
padding = 4
widget_spacing = 8
margin_ends = 0
panel_overlap = 0

# ─────────────────────────────────────────────
# Background / Shape
# ─────────────────────────────────────────────
background_opacity = 0.6

radius = 0
radius_bottom_left = 20
radius_bottom_right = 20

capsule_border_width = 0.0
capsule_opacity = 0.6
capsule_padding = 8.0
capsule_thickness = 1

# ─────────────────────────────────────────────
# Effects
# ─────────────────────────────────────────────
shadow = false
hover_highlight = false


# =========================================================
# WORKSPACES
# =========================================================

[widget.workspaces]
hide_when_empty = true
show_labels = false

[widget.workspaces.actions]
middle = "none"
right = "exec niri msg action toggle-overview"


# =========================================================
# WIDGETS
# =========================================================

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.network]
show_label = false


# =========================================================
# CONTROL CENTER
# =========================================================

[control_center]
hidden_tabs = ["weather", "screen-time"]
show_session_button = true
show_shortcut_labels = false
width = 800

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "dark_mode"

[[control_center.shortcuts]]
type = "power_profile"


# =========================================================
# DOCK
# =========================================================

[dock]
# Appearance
background_opacity = 0.6
active_opacity = 0.8
inactive_opacity = 0.8
shadow = false

# Icons / Items
icon_size = 24
item_spacing = 8
inactive_scale = 1.0
magnification_scale = 1.0
show_instance_count = false

# Position / Behavior
launcher_position = "start"
layer = "overlay"
margin_edge = 4
pinned = ["zen", "kitty"]
reserve_space = false
smart_auto_hide = true

# Shape
concave_edge_corners = false


# =========================================================
# NOTIFICATIONS
# =========================================================

[notification]
# Appearance
background_opacity = 0.6
border = false
layer = "overlay"

# Position
offset_x = 4
offset_y = 4

# Behavior
max_visible = 3


# =========================================================
# OSD
# =========================================================

[osd]
# State
enabled = false

# Appearance
background_opacity = 0.6
border = false

# Position
offset_x = 4
offset_y = 4
orientation = "vertical"
position = "center_right"
position_vertical = "center_right"

