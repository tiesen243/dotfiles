# =========================================================
# THEME
# =========================================================

[theme]
builtin = "Noctalia"
source = "wallpaper"
wallpaper_scheme = "soft"
pure_black_dark = true


# ---------------------------------------------------------
# Theme Templates
# ---------------------------------------------------------

[theme.templates]
builtin_ids = ["btop", "gtk3", "gtk4", "hyprland", "kitty", "niri"]
enable_community_templates = false


# =========================================================
# WALLPAPER
# =========================================================

[wallpaper]
directory = "~/Pictures/wallpapers"

# Appearance
edge_smoothness = 0.01
transition = ["fade"]
transition_duration = 300


# ---------------------------------------------------------
# Wallpaper Automation
# ---------------------------------------------------------

[wallpaper.automation]
order = "alphabetical"
recursive = false


# =========================================================
# BACKDROP
# =========================================================

[backdrop]
enabled = true


# =========================================================
# DESKTOP WIDGETS
# =========================================================

[desktop_widgets]
enabled = false

